  region: road_south
- id: B1
  kind: parallel
  # [B3 修复] B1 的 cx **保持 −8.1**，改从**世界侧**解决余量。
  # 原先 B1 的车位框东边缘离 `parked_b1`（x=−3.6）只有 **0.15 m**：
  # 目标位姿处车体到邻车就只剩 0.15 m，比 0.20 m 的验收线还小，等于这个位
  # 怎么停都过不了 —— 真机三轮的最小间隙稳定在 0.21~0.26 m 擦线，最后一轮
  # 倒车还被后方护栏按 0.30 m 挡在 0.23 m 处，5 次微调全白做、终点差 6.71 m。
  # 试过把 cx 居中到 −10.8（两侧真中点），但运行时栅格把那个目标点判成
  # 「goal 位姿被占据」并陷入重选循环（离线 check_goal_gap.py 用的是 world SDF
  # 里的车位框，跟运行时的判定口径不一致，看不出这个问题）。
  # 最终做法：**把 `parked_b1` 从 x=−3.6 东移到 −1.8**（见
  # `parking_lot_city/worlds/city_parking_lot.sdf`）。这样
  #   · B1 目标处到东邻车的间隙 0.15 → **1.95 m**；
  #   · B3（cx=3.6）西侧邻车间隙 1.725 → **1.05 m**，仍然够。
  # 两个位依然各自夹在两台停放车之间，侧方位形态不变。
  # [B3 修复 · 加宽车位深度] cy −32.0 → −32.6、w 2.4 → 3.2（B1/B3/B5 同步）。
  # 原因：`goal_pose` 就是车位中心，旧中心离北侧人行道路缘（y=−30.8）
  # 只有 0.275 m —— 自车宽 1.85 m、车位深 2.4 m，单侧净空 0.275 m。
  # 真机 B1 终点已经到 0.16 m / 7.7°（判据 0.35 m / 9° 全达标），
  # 但 7.7° 的航向残差让车角横向多扫出 (4.35/2)·sin7.7° ≈ 0.29 m，
  # 正好把这点净空吃光 → 整段最小车体间隙 **0.00 m**，被判 INCOMPLETE。
  # 中心南移 0.6 m 后车身占 [−33.525, −31.675]，离路缘 0.875 m，
  # 航向残差有地方去。两侧邻车（parked_b0/b1）仍在原位，侧方位形态不变。
  cx: -8.1
  cy: -32.6
  yaw: 0.0
  l: 6.6
  w: 3.2
  lane_normal: [0.0, -1.0]
  region: road_south
- id: B2
  kind: parallel
  cx: -1.5
  cy: -32.0
  yaw: 0.0
  l: 6.6
  w: 2.4
  lane_normal: [0.0, -1.0]
  region: road_south
- id: B3
  kind: parallel
  # [B3 修复] cx 5.1 → 3.6：同 B1。邻车 parked_b1（车身东沿 −1.425）与
  # parked_b2（车身西沿 8.625）之间的净空是 [−1.425, 8.625]，中点 3.6。
  # 旧值 5.1 让**东侧只剩 0.225 m** —— 真机 B3 三轮都是车尾右后角擦着
  # parked_b2 停死（护栏读数 lon=−2.17 / lat=−0.49，车体间隙 0.00 m），
  # 而规划器按 2.4 m 车位宽算出的余量是 +0.93 m，两边对不上就是因为
  # 实际可用长度只有 6.825 m（不是 6.6 m 的对称车位）。居中后前后各 1.725 m。
  cx: 3.6
  cy: -32.6
  yaw: 0.0
  l: 6.6
  w: 3.2
  lane_normal: [0.0, -1.0]
  region: road_south

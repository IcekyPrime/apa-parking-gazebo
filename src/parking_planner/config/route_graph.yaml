# 车道图（world 帧，单位 m）
#
# 用途：自车可以在主路任意位置生成，需要沿道路开到目标车位所在的车道，最后几米
# 再交给 Hybrid A* 做精细泊车。整街区 200 m 见方，若直接上 Hybrid A* 栅格，
# 单是启发式的 Dijkstra 就要跑 80 万格；分级「图搜索 + 局部运动规划」是常规做法。
#
# 道路几何（来自 build_world.py）
# ------------------------------
# 主路    : y∈[14,26]，双黄线 y=20，车道线 y=17/23 → 每向两车道
#           东行外侧 y=15.65，西行外侧 y=24.35
# 西侧街  : x∈[-33,-25]，中心 x=-29        （单向：自北向南）
# 东侧街  : x∈[25,33]，中心 x=29           （单向：自北向南）
# 南侧道路: y∈[-39,-30]（本轮加宽 8→9），车道中心线 y=-35.8
# 停车场  : 铺面 x∈[-20,20]、y∈[-24,6]；中央绿化岛 x∈[-1.6,1.6]、y∈[-16,-4]；
#           东西两排垂直车位（x=±17，车位口 x=±14.1），岛两侧各有一条 12.5 m 宽
#           的南北向过道（中心 x=±8）；进车道 x∈[-5.5,5.5]
#
# 三条硬约束
# ----------
# 1) 车辆最小转弯半径 5.74 m（docs/03 开环标定）。所有转角按「切线长
#    T = R·tan(φ/2)」生成圆弧，90° 转角需要 5.74 m 的直线余量，所以每条边至少要
#    6.5 m 才能完整圆滑。上一版把场内过道按 8 m 见方的九宫格标，生成的圆弧半径
#    只有 2 m，车转不过来（横向偏差发散到 8 m）。
# 2) 主路是**单向车道**，用 `chains` 声明方向。不然 Dijkstra 会让车逆向行驶抄近路。
# 3) 侧街也是单向（自北向南）。这样两排路侧平行车位都能用「开过车位 → 倒车入位」
#    这一个动作完成，停好车头朝南，与 lot_layout 的标定一致。

nodes:
  # --- 主路东行外侧车道 y=15.65（自西向东）---
  # 每 9~10 m 一个节点：自车可以停在这条主干道的**任意**位置，起点节点必须能在
  # 12 m 内找到，否则「自车 → 首个节点」那一段会变成一条横穿人行道的斜线。
  eb_w88: [-88.0, 15.65]
  eb_w78: [-78.0, 15.65]
  eb_w68: [-68.0, 15.65]
  eb_w58: [-58.0, 15.65]
  eb_w48: [-48.0, 15.65]
  eb_w38: [-38.0, 15.65]
  eb_w29: [-29.0, 15.65]      # 西侧街路口
  eb_w19: [-19.0, 15.65]
  eb_w9:  [-9.0, 15.65]
  eb_0:   [0.0, 15.65]        # 停车场入口
  eb_e9:  [9.0, 15.65]
  eb_e19: [19.0, 15.65]
  eb_e29: [29.0, 15.65]       # 东侧街路口
  eb_e38: [38.0, 15.65]
  eb_e48: [48.0, 15.65]
  eb_e58: [58.0, 15.65]
  eb_e68: [68.0, 15.65]
  eb_e78: [78.0, 15.65]
  eb_e88: [88.0, 15.65]

  # --- 主路西行外侧车道 y=24.35（自东向西）---
  wb_e88: [88.0, 24.35]
  wb_e78: [78.0, 24.35]
  wb_e68: [68.0, 24.35]
  wb_e58: [58.0, 24.35]
  wb_e48: [48.0, 24.35]
  wb_e38: [38.0, 24.35]
  wb_e29: [29.0, 24.35]
  wb_e19: [19.0, 24.35]
  wb_e9:  [9.0, 24.35]
  wb_0:   [0.0, 24.35]
  wb_w9:  [-9.0, 24.35]
  wb_w19: [-19.0, 24.35]
  wb_w29: [-29.0, 24.35]
  wb_w38: [-38.0, 24.35]
  wb_w48: [-48.0, 24.35]
  wb_w58: [-58.0, 24.35]
  wb_w68: [-68.0, 24.35]
  wb_w78: [-78.0, 24.35]
  wb_w88: [-88.0, 24.35]

  # --- 停车场入口与场内过道 ---
  # 关键：从进车道（x=0，南北向）切到东西两条过道（x=±8）需要横移 8 m。
  # 按最小转弯半径 5.74 m 算，一次横移至少需要 10.9 m 的纵向距离；所以
  # 「lot_n → 过道节点」这一条边做成 12.8 m 的斜线，圆滑后是两段 38.7° 的
  # 平缓圆弧。如果只给 8 m（上一版 lot_n→lot_e1 在 y 方向仅 8 m），生成的
  # S 弯超出车辆能力，跟踪时车会直接冲到中央绿化岛上。
  lot_n:  [0.0, 6.0]
  lot_w1: [-8.0, -4.0]
  lot_w2: [-8.0, -11.0]
  lot_w3: [-8.0, -19.0]
  lot_e1: [8.0, -4.0]
  lot_e2: [8.0, -11.0]
  lot_e3: [8.0, -19.0]
  # [本轮 · P 排] 西/东过道之间（P 排车位口正前方）补一个节点。
  # P1 的预备位姿 (-0.8,-20.1) 离 lot_w3/lot_e3 都有 7.2 m+，路线只能停在
  # ±8 的过道上交接（真机 P1 交接偏差 7.2 m / 92°，ALIGN 摆不回来）。
  # 这个节点在 P 排过道中心 (0,-19)，路线可以一路开到 P1/P3 预备位姿旁边
  # （离线复测：P1 交接距离从 7.2 m 收到 1.6 m，ALIGN 一段收敛）。
  lot_p: [0.0, -19.0]
  # [本轮修复 · 建议 4] **删除 `lot_e4: [8.0, -28.0]`**。
  # 原来的注释说「东过道向南补一个节点，E0~E3 的预备位姿整段落在过道之外」，
  # 但 y=-28 已经**出了停车场铺面**（铺面只到 y=-24）：`check_route.py` 量到
  # 去 B3 的路线有 **9 个穿墙点**，命中 `lot_ring_s`（南侧环路）与
  # `sidewalk_south_road_1`（人行道），路线最后 9 m 一直压在人行道上。
  # 真机 B3 三轮「全局路线行驶超时」+「激光护栏连续 217 s」，就是自车在这段
  # 穿墙路线上被护栏硬拦住 —— 不是被停放车挡的。
  # 而且它对本来的目标也无益：E0 的预备位姿 (11.5,-22.25) 距 lot_e4 (8,-28)
  # 是 6.9 m、距 lot_e3 (8,-19) 只有 4.8 m，删掉反而让交接点更近。
  # 东过道合法终点就是 lot_e3 (8,-19)，再往南没有铺面。

  # --- 西侧街（中心 x=-29）---
  # y 坐标对准平行车位的「预备位姿」：车位中心在 SIDE_STALL_Y=(…,-15,-9,-3,3,9)，
  # 预备位姿在车位南侧 5.2 m，即 -20.2/-14.2/-8.2/-2.2 附近。节点取整数位，
  # 这样路线能一路开到预备位姿，交接给 Hybrid A* 时车已经摆正在车位旁边。
  # [本轮修复 · 建议 4] 车道中心线整体向**路中**偏移 0.6 m（-29.0 → -28.4）。
  # 原因：西街路边平行位（SW 排，车位中心 x=-31.65、深 2.4 m）里停着车时，
  # 车身左沿到 x=-30.45，而原中心线 x=-29 只留 1.45 m —— 自车半宽 0.925 m，
  # 跟踪残差 0.4 m 就直接贴死。真机 SW1 在 (-26.0, 9.9) 卡死 309 s 虽主因是
  # 让行死锁，但 SE1 在东街 (29.4, 0.6) 被 SE3 的停放车挡住（中心 (31.6,-3.0)，
  # 距 2.31 m）就是这条余量不足的直接后果。
  ws_8:   [-28.4, 8.0]        # 路口（与主路相交）
  ws_1:   [-28.4, 1.0]
  ws_m4:  [-28.4, -4.0]
  ws_m10: [-28.4, -10.0]
  ws_m16: [-28.4, -16.0]
  ws_m22: [-28.4, -22.0]
  ws_m27: [-28.4, -27.0]
  ws_m34: [-28.4, -35.8]      # 路口（与南侧道路相交）

  # --- 东侧街（中心 x=29，同样向路中偏移到 28.4）---
  es_8:   [28.4, 8.0]
  es_1:   [28.4, 1.0]
  es_m4:  [28.4, -4.0]
  es_m10: [28.4, -10.0]
  es_m16: [28.4, -16.0]
  es_m22: [28.4, -22.0]
  es_m27: [28.4, -27.0]
  es_m34: [28.4, -35.8]

  # --- 南侧道路（东西向，-34 → -34.5 → -35.8）---
  # 北侧是 B 排路边平行位。车位本轮南移到 y=-32.0（北沿 -30.8，躲人行道），
  # 停放车车身南沿到 y=-32.925；中心线 y=-34.5 时自车北沿 -33.575，
  # **横向只剩 0.65 m** —— 而 B3 两侧（B2/B4）都停着车，整条南侧道路都要
  # 贴着这三辆车过去，跟踪残差 0.13 m 就吃掉 1/5 余量，B 排最容易在这里
  # 被判「路线前方有障碍」而卡死。整条车道再向南移 1.3 m 到 y=-35.8，
  # 横向余量升到 1.95 m（南侧道路 y∈[-39,-30]，路面仍够）。
  sr_w:   [-45.0, -35.8]
  sr_w20: [-20.0, -35.8]
  sr_0:   [0.0, -35.8]
  sr_e20: [20.0, -35.8]
  sr_e:   [45.0, -35.8]
  # [本轮修复 · B 排] 在每个 B 车位的**预备位姿正下方**加一个车道节点。
  #
  # 原因：B 排 6 个车位的预备位姿 x = 车位中心 + 5.8 m（B0..B5 → -12.2/-5.0/
  # +2.2/+9.4/+16.6/+23.8，y=-34.7），而南侧道路原本只有 x=-45/-20/0/+20/+45
  # 五个节点。B3 的预备位姿（x=+9.4）离最近的 sr_e20（x=+20）还有 9.4 m，
  # 于是 `RouteGraph.plan` 把终点定在 sr_e20，末端「节点→预备位」那一腿因为
  # 与行进方向相反（夹角 180°）被 `append_min` 的 55° 规则丢掉 —— 路线就在
  # 车位**东边 9.4 m 处结束**，自车冲过车位后只能靠 ALIGN 倒 9.4 m 回去。
  # 真机 B3 的实测：ALIGN 规划出「纯倒车 9.4 m」，而南侧道路上 risk 每 1 s
  # 在 safe/danger 之间翻一次，cmd_mux 反复 stop，40 s 只退了 0.26 m；
  # 45 s 对齐超时 → 在距预备位 9.09 m 处直接入位 → 只剩 18.8 m / 倒车 16.98 m /
  # 车体余量 +0.12 m 的揉库解 → 重搜 3 次仍是 +0.12 m → 判 INCOMPLETE。
  # 有了这 6 个节点，`g_d` 只有 1.1 m（< 1.6 m），路线直接收在节点上，
  # 自车停在预备位姿旁边交接入位，不需要任何长距离倒车。
  sr_b0:  [-12.2, -35.8]
  sr_b1:  [-5.0, -35.8]
  sr_b2:  [2.2, -35.8]
  sr_b3:  [9.4, -35.8]
  sr_b4:  [16.6, -35.8]
  sr_b5:  [23.8, -35.8]

# 单向车道链：列表顺序即行驶方向。
# 注意侧街**不能**做成单向：主路两条车道是单向的，若侧街也单向，那么「主路东行
# 段已经开过停车场入口」或「走西行车道想去停车场」这两种情况就再也回不到入口，
# 图上不连通。侧街宽度 8 m、没有车道线，按双向处理，绕行路线才是合法的。
chains:
  - [eb_w88, eb_w78, eb_w68, eb_w58, eb_w48, eb_w38, eb_w29, eb_w19, eb_w9,
     eb_0, eb_e9, eb_e19, eb_e29, eb_e38, eb_e48, eb_e58, eb_e68, eb_e78, eb_e88]
  - [wb_e88, wb_e78, wb_e68, wb_e58, wb_e48, wb_e38, wb_e29, wb_e19, wb_e9,
     wb_0, wb_w9, wb_w19, wb_w29, wb_w38, wb_w48, wb_w58, wb_w68, wb_w78, wb_w88]

edges:
  # 侧街（双向）
  - [ws_8, ws_1]
  - [ws_1, ws_m4]
  - [ws_m4, ws_m10]
  - [ws_m10, ws_m16]
  - [ws_m16, ws_m22]
  - [ws_m22, ws_m27]
  - [ws_m27, ws_m34]
  - [es_8, es_1]
  - [es_1, es_m4]
  - [es_m4, es_m10]
  - [es_m10, es_m16]
  - [es_m16, es_m22]
  - [es_m22, es_m27]
  - [es_m27, es_m34]
  # 路口：车道 ←→ 侧街（进/出都从这里走；掉头由转向代价禁止）
  - [eb_w29, ws_8]
  - [wb_w29, ws_8]
  - [eb_e29, es_8]
  - [wb_e29, es_8]
  # 停车场入口（东行右转进场）与场内过道
  - [eb_0, lot_n]
  - [lot_n, lot_w1]
  - [lot_w1, lot_w2]
  - [lot_w2, lot_w3]
  - [lot_w3, lot_p]
  - [lot_n, lot_e1]
  - [lot_e1, lot_e2]
  - [lot_e2, lot_e3]
  - [lot_e3, lot_p]
  # [本轮修复] `lot_e4` 已删除（节点在铺面外出界），对应边一并去掉。
  # [本轮清理] 原来这里有一条 `- [lot_s, lot_e3]`，但 nodes 里从来没有
  # `lot_s` 这个节点（历史遗留），加载时被静默丢弃。删掉以免误导读图的人。
  # 侧街 ←→ 南侧道路
  - [ws_m34, sr_w]
  - [ws_m34, sr_w20]
  # [本轮修复] 原来是 `[es_m34, sr_e20]`。东街南口在 x=28.4，而 sr_e20 在 x=20、
  # 新增的 sr_b5 在 x=23.8 —— 从东街下来右转（向西）时先跳到 sr_e20、再被
  # 目标节点拉回东边的 sr_b5，路线在 sr_e20 处折返 180°（实测 B5 两条路线
  # 曲率 R=0.73 m）。改成直接接最近的 sr_b5，几何单调不折返。
  - [es_m34, sr_b5]
  - [es_m34, sr_e]
  # 南侧道路（按 x 递增串成一条链，B 排节点插在各自的位置上）
  - [sr_w, sr_w20]
  - [sr_w20, sr_b0]
  - [sr_b0, sr_b1]
  - [sr_b1, sr_0]
  - [sr_0, sr_b2]
  - [sr_b2, sr_b3]
  - [sr_b3, sr_b4]
  - [sr_b4, sr_e20]
  - [sr_e20, sr_b5]
  - [sr_b5, sr_e]

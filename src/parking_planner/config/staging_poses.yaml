# 顶死的车位（如 E2 撞南墙）用近距扫描兜底成 1 换挡；车体余量 ≥ 0.30 m；
# 本轮算不出解的车位原样保留上一次的值。
# 半径为什么取 5.74 而不是更小：环状对比过 5.74 m（plan_max_steer
# 0.44），执行间隙从 +0.59 掉到 +0.25、末端航向从 0.4° 变 2.7°——
# 半径变小等于曲率变大，车身扫掠包络更贴邻车，反馈余量也被吃掉
# 一半。前提是 steer_gain 标定正确（1.04），不能靠放大半径去掩盖
# 增益误差。
#
# 存的是**车位局部坐标** [along, lateral, dyaw]，不是绝对坐标——
# 绝对坐标在 to_frame(spawn) 之后会混帧（自车 map 帧、预备 world 帧）。
